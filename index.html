<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigenère Cipher Decrypter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Vigenère Cipher Decrypter</h1>
    <p>Enter ciphertext below to analyze it.</p>

    <textarea id="ciphertext" rows="8" cols="60"
        placeholder="Paste your ciphertext here..."></textarea>

    <br><br>
    <button id="decrypt-button">Decrypt</button>

    <div id="results"></div>
<section id="graph-results">
    <h2>Frequency Analysis Graphs</h2>
    <div id="graph-container"></div>
</section>

<section id="decrypted-results">
    <h2>Decryption Results</h2>
    <div id="decrypted-text"></div>
</section>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
